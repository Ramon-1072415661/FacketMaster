spring:
  application:
    name: event-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.facketmaster: INFO
    org.springframework.web: WARN
    org.flywaydb: INFO

app:
  jwt:
    secret: ${JWT_SECRET:mudar-em-prod}
    expiracao-ms: ${JWT_EXPIRACAO_MS:86400000}