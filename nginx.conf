user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
  use epoll;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  log_format json_combined escape=json
    '{'
      '"time_local":"$time_local",'
      '"remote_addr":"$remote_addr",'
      '"request":"$request",'
      '"status": "$status",'
      '"body_bytes_sent":"$body_bytes_sent",'
      '"request_time":"$request_time",'
      '"upstream_response_time":"$upstream_response_time",'
      '"http_referer":"$http_referer",'
      '"http_user_agent":"$http_user_agent"'
    '}';

  access_log /var/log/nginx/access.log json_combined;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  client_max_body_size 20M;

  # ════════════════════════════════════════════════════════════════════════════
  # Upstream — Load Balancing pools
  # ════════════════════════════════════════════════════════════════════════════

  upstream event_service_backend {
    least_conn;  # Algoritmo: least connections (melhor distribuição)
    server event-service-1:8081 max_fails=3 fail_timeout=10s weight=1;
    server event-service-2:8081 max_fails=3 fail_timeout=10s weight=1;
    keepalive 32;
  }

  upstream payment_service_backend {
    least_conn;
    server payment-service-1:8082 max_fails=3 fail_timeout=10s weight=1;
    server payment-service-2:8082 max_fails=3 fail_timeout=10s weight=1;
    keepalive 32;
  }

  # ════════════════════════════════════════════════════════════════════════════
  # Server block — API Gateway
  # ════════════════════════════════════════════════════════════════════════════

  server {
    listen 80 default_server;
    server_name _;

    # ────────────────────────────────────────────────────────────────────────
    # Health check endpoint para load balancer/orchestrator
    # ────────────────────────────────────────────────────────────────────────
    location /health {
      access_log off;
      return 200 "OK\n";
      add_header Content-Type text/plain;
    }

    # ────────────────────────────────────────────────────────────────────────
    # Metrics/Status — para monitoramento
    # ────────────────────────────────────────────────────────────────────────
    location /nginx-status {
      access_log off;
      stub_status on;
    }

    # ────────────────────────────────────────────────────────────────────────
    # Event Service — CRUD de eventos + Auth
    # ────────────────────────────────────────────────────────────────────────
    location ~ ^/(auth|api/v1/eventos) {
      proxy_pass http://event_service_backend;
      proxy_http_version 1.1;
      
      # Preserve headers
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
      
      # Connection keep-alive
      proxy_set_header Connection "";
      
      # Timeout
      proxy_connect_timeout 30s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
      
      # Buffering
      proxy_buffering on;
      proxy_buffer_size 4k;
      proxy_buffers 8 4k;
      proxy_busy_buffers_size 8k;
    }

    # ────────────────────────────────────────────────────────────────────────
    # Payment Service — Pedidos e Pagamentos
    # ────────────────────────────────────────────────────────────────────────
    location ~ ^/api/v1/(pedidos|pagamentos) {
      proxy_pass http://payment_service_backend;
      proxy_http_version 1.1;
      
      # Preserve headers
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
      
      # Connection keep-alive
      proxy_set_header Connection "";
      
      # Timeout
      proxy_connect_timeout 30s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
      
      # Buffering
      proxy_buffering on;
      proxy_buffer_size 4k;
      proxy_buffers 8 4k;
      proxy_busy_buffers_size 8k;
    }

    # ────────────────────────────────────────────────────────────────────────
    # Catch-all — 404
    # ────────────────────────────────────────────────────────────────────────
    location / {
      return 404;
    }

    # ────────────────────────────────────────────────────────────────────────
    # Error pages
    # ────────────────────────────────────────────────────────────────────────
    error_page 502 503 504 /50x.html;
    location = /50x.html {
      root /usr/share/nginx/html;
    }
  }
}
