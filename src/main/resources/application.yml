spring:
  application:
    name: event-service

  datasource:
    url: ${DB_URL:jdbc:h2:mem:eventdb;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: ${DB_DIALECT:org.hibernate.dialect.H2Dialect}

  h2:
    console:
      enabled: true
      path: /h2-console

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

server:
  port: ${PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: event-service

logging:
  level:
    com.ingressos: INFO
    org.springframework.web: WARN
    org.flywaydb: INFO

app:
  rabbitmq:
    exchange: ingressos.exchange
    queues:
      evento-criado: evento.criado
      evento-atualizado: evento.atualizado
      evento-deletado: evento.deletado
  jwt:
    secret: ${JWT_SECRET:mudadr-em-prod}
    expiracao-ms: ${JWT_EXPIRACAO_MS:86400000}
