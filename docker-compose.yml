version: '3.9'

services:
  # ════════════════════════════════════════════════════════════════════════════
  # NGINX — Load Balancer + API Gateway
  # ════════════════════════════════════════════════════════════════════════════
  nginx:
    image: nginx:1.27-alpine
    container_name: facketmaster-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx_configs:/etc/nginx/conf.d:ro
    depends_on:
      - event-service-1
      - event-service-2
      - payment-service-1
      - payment-service-2
    networks:
      - facketmaster-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════════════════════
  # PostgreSQL — Banco de dados central
  # ════════════════════════════════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: facketmaster-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: facketmaster
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - facketmaster-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════════════════════
  # Redis — Cache de reservas e pagamentos
  # ════════════════════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: facketmaster-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - facketmaster-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════════════════════
  # RabbitMQ — Message Broker (comunicação assíncrona)
  # ════════════════════════════════════════════════════════════════════════════
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: facketmaster-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - facketmaster-network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════════════════════
  # EVENT-SERVICE × 2 instâncias
  # ════════════════════════════════════════════════════════════════════════════
  event-service-1:
    build:
      context: .
      dockerfile: event-service/Dockerfile
    container_name: facketmaster-event-service-1
    environment:
      INSTANCE_NAME: event-service-1
      DB_URL: jdbc:postgresql://postgres:5432/facketmaster
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRACAO_MS: ${JWT_EXPIRACAO_MS}
      AUTH_USER: ${AUTH_USER}
      AUTH_PASSWORD: ${AUTH_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - facketmaster-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  event-service-2:
    build:
      context: .
      dockerfile: event-service/Dockerfile
    container_name: facketmaster-event-service-2
    environment:
      INSTANCE_NAME: event-service-2
      DB_URL: jdbc:postgresql://postgres:5432/facketmaster
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRACAO_MS: ${JWT_EXPIRACAO_MS}
      AUTH_USER: ${AUTH_USER}
      AUTH_PASSWORD: ${AUTH_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - facketmaster-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════════════════════
  # PAYMENT-SERVICE × 2 instâncias
  # ════════════════════════════════════════════════════════════════════════════
  payment-service-1:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: facketmaster-payment-service-1
    environment:
      INSTANCE_NAME: payment-service-1
      DB_URL: jdbc:postgresql://postgres:5432/facketmaster
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      PAYMENT_MOCK_DELAY_MS: ${PAYMENT_MOCK_DELAY_MS}
      APP_PAYMENT_MOCK_DELAY_MS: ${PAYMENT_MOCK_DELAY_MS}
      PIX_EXPIRACAO_MINUTOS: ${PIX_EXPIRACAO_MINUTOS}
      BOLETO_EXPIRACAO_DIAS: ${BOLETO_EXPIRACAO_DIAS}
      PAYMENT_CACHE_TTL_SECONDS: ${PAYMENT_CACHE_TTL_SECONDS}
      EVENT_SERVICE_URL: ${EVENT_SERVICE_URL}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - facketmaster-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  payment-service-2:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: facketmaster-payment-service-2
    environment:
      INSTANCE_NAME: payment-service-2
      DB_URL: jdbc:postgresql://postgres:5432/facketmaster
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      PAYMENT_MOCK_DELAY_MS: ${PAYMENT_MOCK_DELAY_MS}
      APP_PAYMENT_MOCK_DELAY_MS: ${PAYMENT_MOCK_DELAY_MS}
      PIX_EXPIRACAO_MINUTOS: ${PIX_EXPIRACAO_MINUTOS}
      BOLETO_EXPIRACAO_DIAS: ${BOLETO_EXPIRACAO_DIAS}
      PAYMENT_CACHE_TTL_SECONDS: ${PAYMENT_CACHE_TTL_SECONDS}
      EVENT_SERVICE_URL: ${EVENT_SERVICE_URL}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - facketmaster-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.0
    container_name: facketmaster-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - facketmaster-network
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.0
    container_name: facketmaster-promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - facketmaster-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: facketmaster-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - loki
    networks:
      - facketmaster-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: facketmaster-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - event-service-1
      - event-service-2
      - payment-service-1
      - payment-service-2
    networks:
      - facketmaster-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  facketmaster-network:
    driver: bridge
