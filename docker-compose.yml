version: '3.9'

services:
  # ════════════════════════════════════════════════════════════════════════════
  # NGINX — Load Balancer + API Gateway
  # ════════════════════════════════════════════════════════════════════════════
  nginx:
    image: nginx:1.27-alpine
    container_name: facketmaster-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx_configs:/etc/nginx/conf.d:ro
    depends_on:
      - event-service-1
      - event-service-2
      - payment-service-1
      - payment-service-2
    networks:
      - facketmaster-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════════════════════
  # PostgreSQL — Banco de dados central
  # ════════════════════════════════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: facketmaster-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-facketmaster}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-facketmaster123}
      POSTGRES_DB: facketmaster
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - facketmaster-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-facketmaster}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════════════════════
  # Redis — Cache de reservas e pagamentos
  # ════════════════════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: facketmaster-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - facketmaster-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════════════════════
  # RabbitMQ — Message Broker (comunicação assíncrona)
  # ════════════════════════════════════════════════════════════════════════════
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: facketmaster-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - facketmaster-network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════════════════════
  # EVENT-SERVICE × 2 instâncias
  # ════════════════════════════════════════════════════════════════════════════
  event-service-1:
    build:
      context: .
      dockerfile: event-service/Dockerfile
    container_name: facketmaster-event-service-1
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/facketmaster
      DB_USER: ${DB_USER:-facketmaster}
      DB_PASSWORD: ${DB_PASSWORD:-facketmaster123}
      JWT_SECRET: ${JWT_SECRET:-seu_jwt_secret_super_secreto_aqui_2026}
      JWT_EXPIRACAO_MS: ${JWT_EXPIRACAO_MS:-86400000}
      AUTH_USER: ${AUTH_USER:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-admin123}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - facketmaster-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  event-service-2:
    build:
      context: .
      dockerfile: event-service/Dockerfile
    container_name: facketmaster-event-service-2
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/facketmaster
      DB_USER: ${DB_USER:-facketmaster}
      DB_PASSWORD: ${DB_PASSWORD:-facketmaster123}
      JWT_SECRET: ${JWT_SECRET:-seu_jwt_secret_super_secreto_aqui_2026}
      JWT_EXPIRACAO_MS: ${JWT_EXPIRACAO_MS:-86400000}
      AUTH_USER: ${AUTH_USER:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-admin123}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - facketmaster-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════════════════════
  # PAYMENT-SERVICE × 2 instâncias
  # ════════════════════════════════════════════════════════════════════════════
  payment-service-1:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: facketmaster-payment-service-1
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/facketmaster
      DB_USER: ${DB_USER:-facketmaster}
      DB_PASSWORD: ${DB_PASSWORD:-facketmaster123}
      JWT_SECRET: ${JWT_SECRET:-seu_jwt_secret_super_secreto_aqui_2026}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      PAYMENT_MOCK_DELAY_MS: ${PAYMENT_MOCK_DELAY_MS:-500}
      PIX_EXPIRACAO_MINUTOS: ${PIX_EXPIRACAO_MINUTOS:-30}
      BOLETO_EXPIRACAO_DIAS: ${BOLETO_EXPIRACAO_DIAS:-3}
      PAYMENT_CACHE_TTL_SECONDS: ${PAYMENT_CACHE_TTL_SECONDS:-600}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - facketmaster-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  payment-service-2:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: facketmaster-payment-service-2
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/facketmaster
      DB_USER: ${DB_USER:-facketmaster}
      DB_PASSWORD: ${DB_PASSWORD:-facketmaster123}
      JWT_SECRET: ${JWT_SECRET:-seu_jwt_secret_super_secreto_aqui_2026}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      PAYMENT_MOCK_DELAY_MS: ${PAYMENT_MOCK_DELAY_MS:-500}
      PIX_EXPIRACAO_MINUTOS: ${PIX_EXPIRACAO_MINUTOS:-30}
      BOLETO_EXPIRACAO_DIAS: ${BOLETO_EXPIRACAO_DIAS:-3}
      PAYMENT_CACHE_TTL_SECONDS: ${PAYMENT_CACHE_TTL_SECONDS:-600}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - facketmaster-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  facketmaster-network:
    driver: bridge
