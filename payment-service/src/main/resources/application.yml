spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:postgresql://postgres:5432/facketmaster # Corrigido para URL direta
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      ddl-auto: none # Alterado de 'validate' para 'none'

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    repair-on-migrate: true
    validate-on-migrate: false # Adicionado para desenvolvimento
    clean-before-validate: true # Adicionado para garantir limpeza
    clean-on-validation-error: true # Adicionado para garantir limpeza em caso de erro

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/}

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.facketmaster: INFO
    org.springframework.web: WARN
    org.flywaydb: INFO

app:
  jwt:
    secret: ${JWT_SECRET}
  payment:
    cache-ttl-seconds: ${PAYMENT_CACHE_TTL_SECONDS:600}

payment:
  mock:
    delay-ms: ${PAYMENT_MOCK_DELAY_MS:500}

pix:
  expiracao-minutos: ${PIX_EXPIRACAO_MINUTOS:30}

boleto:
  expiracao-dias: ${BOLETO_EXPIRACAO_DIAS:3}