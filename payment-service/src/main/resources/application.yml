spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:postgresql://postgres:5432/facketmaster # Corrigido para URL direta
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      ddl-auto: none # Alterado de 'validate' para 'none'

  flyway:
    enabled: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST}

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.facketmaster: INFO
    org.springframework.web: WARN
    org.flywaydb: INFO

app:
  jwt:
    secret: ${JWT_SECRET}
  payment:
    cache-ttl-seconds: ${PAYMENT_CACHE_TTL_SECONDS}
  event-service:
    base-url: ${EVENT_SERVICE_URL}

payment:
  mock:
    delay-ms: ${PAYMENT_MOCK_DELAY_MS}

pix:
  expiracao-minutos: ${PIX_EXPIRACAO_MINUTOS}

boleto:
  expiracao-dias: ${BOLETO_EXPIRACAO_DIAS}